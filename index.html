<html>

<head>
    <title>Cosmic Encounter Phase Tracker</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
</head>

<body>
    <h1 id="phase"></h1>

    <script type="text/javascript">
        const phases = [
            "Start Turn",
            "Regroup",
            "Destiny",
            "Launch",
            "Alliance",
            "Planning",
            "Reveal",
            "Resolution"
        ];

        let phaseIndex = 0;

        function nextPhase() {
            document.getElementById("phase").innerHTML = phases[phaseIndex++ % phases.length];
        }

        document.addEventListener("click", nextPhase);
        nextPhase();
    </script>
    <style type="text/css">
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 {
            user-select: none;
            color: white;
            text-transform: uppercase;
            font-family: sans-serif;
            text-align: center;
            width: 100%;
            font-size: 10vw;
            white-space: nowrap;
        }
    </style>
</body>

</html>
